[package]
name = "portable-builder-kit"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Sean Shaffer"]
description = "Reusable PortableApps package preflight and verified build artifact selection"
repository = "https://github.com/SeanShaffer88/SetupSweep"
readme = "README.md"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }

[features]
test-fixture = []

[[bin]]
name = "pafkit-test-tool"
path = "tests/support/tool_fixture.rs"
required-features = ["test-fixture"]
