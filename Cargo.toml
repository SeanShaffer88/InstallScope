[package]
name = "setupsweep"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
resolver = "3"
authors = ["Sean Shaffer"]
description = "Windows install, cleanup, uninstall, and recovery toolkit."
license = "MIT"
repository = "https://github.com/SeanShaffer88/SetupSweep"
homepage = "https://github.com/SeanShaffer88/SetupSweep"
readme = "README.md"
keywords = ["uninstaller", "windows", "install-monitor", "registry", "snapshot"]
categories = ["command-line-utilities", "os::windows-apis", "gui"]
build = "build.rs"

[lib]
name = "setupsweep_core"
path = "src/lib.rs"

[features]
native-ui-preview = []

[[bin]]
name = "setupsweep"
path = "src/main.rs"

[dependencies]
portable-builder-kit = { path = "crates/portable-builder-kit", version = "0.2.0" }
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = { version = "0.33", default-features = false }
egui_extras = { version = "0.33", default-features = false }

# Development builds on Linux (for screenshots and UI checks); releases are Windows-only.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11"] }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "parking_lot"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "dx12", "parking_lot"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"


# Test builds in CI: release optimisation without the slow whole-program
# link-time optimisation, so the integration tests start minutes sooner.
[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 16

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
