[package]
name = "setupscope"
version = "1.0.0"
edition = "2021"
rust-version = "1.91"
resolver = "3"
default-run = "setupscope"
authors = ["Sean Shaffer"]
description = "Windows desktop developer toolkit: project readiness, diagnostics, reviewed environments and offline dependencies."
license = "MIT"
repository = "https://github.com/SeanShaffer88/SetupScope"
homepage = "https://github.com/SeanShaffer88/SetupScope"
readme = "README.md"
keywords = ["windows", "developer-tools", "diagnostics", "environment", "desktop"]
categories = ["command-line-utilities", "os::windows-apis", "gui"]
build = "build.rs"

[lib]
name = "setupscope_core"
path = "src/lib.rs"

[features]
native-ui-preview = []

[[bin]]
name = "setupscope"
path = "src/main.rs"

[[bin]]
name = "setupscope-cli"
path = "src/cli_main.rs"

[dependencies]
anyhow = "1"
# Already locked transitive crates, reused for project manifests/version syntax.
toml = "=1.1.8"
semver = "=1.0.28"
quick-xml = "=0.41.0"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = { version = "0.33", default-features = false }
egui_extras = { version = "0.33", default-features = false }

# Development builds on Linux (for screenshots and UI checks); releases are Windows-only.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11"] }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "parking_lot"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "dx12", "parking_lot"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"


# Test builds in CI: release optimisation without the slow whole-program
# link-time optimisation, so the integration tests start minutes sooner.
[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 16

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Existing dependency, locally patched to expose child-window UIA controls.
[patch.crates-io]
eframe = { path = "vendor/eframe-0.33.3" }
