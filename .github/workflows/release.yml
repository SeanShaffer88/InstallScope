name: Package candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: cargo build --example lockholder --locked
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package without publication or installation
        shell: pwsh
        run: ./scripts/package-local.ps1 -Destination "$PWD/dist/SetupScope-local"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SetupScope-windows-x64-candidate
          path: dist/SetupScope-local
