name: Release

# Build and publish the installer and portable zip. Triggered by pushing a
# tag like v0.1.0, by pushing to the `release` branch (the tag v<version> from
# Cargo.toml is created automatically), or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Optional secrets; the steps that use them are skipped when they are unset.
    env:
      CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
      CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Build for Arm64
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo build --release --locked --target aarch64-pc-windows-msvc

      # Optional: set the repository secrets CODESIGN_PFX (the certificate as
      # base64) and CODESIGN_PASSWORD to sign everything that is published.
      # Signed downloads are trusted by SmartScreen and antivirus software.
      - name: Sign the programs
        if: env.CODESIGN_PFX != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CODESIGN_PFX))
          try {
            foreach ($f in 'target/release/setupscope.exe', 'target/aarch64-pc-windows-msvc/release/setupscope.exe') {
              & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d SetupScope $f
              if ($LASTEXITCODE -ne 0) { throw "signing $f failed" }
            }
          } finally { Remove-Item "$env:RUNNER_TEMP\cert.pfx" -Force }

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Get the PortableApps.com Launcher (official source, pinned)
        shell: pwsh
        run: |
          $patools = Get-Content -Raw src/patools.rs
          $commit = [regex]::Match($patools, 'LAUNCHER_COMMIT: &str =\s*"([0-9a-f]+)"').Groups[1].Value
          $sha = [regex]::Match($patools, 'MAKENSIS_SHA256: &str =\s*"([0-9a-f]+)"').Groups[1].Value
          Invoke-WebRequest "https://codeload.github.com/PortableApps/Launcher/zip/$commit" -OutFile launcher.zip
          Expand-Archive launcher.zip -DestinationPath launcher-src
          $src = Get-ChildItem launcher-src -Directory | Select-Object -First 1
          New-Item -ItemType Directory "pa-tools" | Out-Null
          Copy-Item $src.FullName "pa-tools/PortableApps.comLauncher" -Recurse
          $t = "pa-tools/PortableApps.comLauncher"
          Remove-Item -Recurse -Force "$t/App/NSIS/Docs", "$t/App/NSIS/Examples", "$t/Other/Source/Manual", "$t/.github" -ErrorAction SilentlyContinue
          Get-ChildItem $t -Recurse -Filter *.chm | Remove-Item -Force
          # Quote the one unquoted ${NSISDIR} include, so paths with spaces work.
          $reg = "$t/Other/Source/Registry.nsh"
          (Get-Content $reg -Raw).Replace('!include ${NSISDIR}\Include\Registry.nsh', '!include "${NSISDIR}\Include\Registry.nsh"') | Set-Content $reg -NoNewline
          $got = (Get-FileHash "$t/App/NSIS/makensis.exe" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "makensis.exe doesn't match the pinned SHA-256 ($got)" }

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory dist, dist/portable | Out-Null
          Copy-Item target/release/setupscope.exe dist/portable/SetupScope.exe
          Copy-Item LICENSE dist/portable/LICENSE.txt
          Copy-Item README.md dist/portable/README.md
          New-Item dist/portable/portable -ItemType File | Out-Null
          Copy-Item pa-tools dist/portable/tools -Recurse
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/SetupScope-$v-portable.zip"
          # Arm64 portable build (Snapdragon and other Arm PCs).
          New-Item -ItemType Directory dist/portable-arm64 | Out-Null
          Copy-Item target/aarch64-pc-windows-msvc/release/setupscope.exe dist/portable-arm64/SetupScope.exe
          Copy-Item LICENSE dist/portable-arm64/LICENSE.txt
          Copy-Item README.md dist/portable-arm64/README.md
          New-Item dist/portable-arm64/portable -ItemType File | Out-Null
          Copy-Item pa-tools dist/portable-arm64/tools -Recurse
          Compress-Archive -Path dist/portable-arm64/* -DestinationPath "dist/SetupScope-$v-arm64-portable.zip"
          makensis "-DVERSION=$v" "-DEXE=..\target\release\setupscope.exe" "-DOUTDIR=..\dist" "-DTOOLS=..\pa-tools\PortableApps.comLauncher" installer\setupscope.nsi
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Sign the installer
        if: env.CODESIGN_PFX != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CODESIGN_PFX))
          try {
            Get-ChildItem dist -Filter 'SetupScope-Setup-*.exe' | ForEach-Object {
              & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "SetupScope Setup" $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signing $($_.Name) failed" }
            }
          } finally { Remove-Item "$env:RUNNER_TEMP\cert.pfx" -Force }
          # The checksums must match the signed files.
          Get-ChildItem dist -File -Exclude SHA256SUMS.txt | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Release notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($v))\].*?(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Value } else { "SetupScope $v" }
          $notes | Set-Content dist/NOTES.md

      # Optional: set the repository secret VIRUSTOTAL_API_KEY to scan every
      # download before it is published. Detections don't stop the release
      # (tools like SetupScope are often flagged by mistake); they are listed as
      # warnings so they can be reported as false positives, and the release
      # notes link to each file's report.
      - name: Scan the downloads with VirusTotal
        if: env.VIRUSTOTAL_API_KEY != ''
        shell: pwsh
        run: |
          $headers = @{ 'x-apikey' = $env:VIRUSTOTAL_API_KEY }
          $lines = @('', '### VirusTotal', '', '| File | Detections | Report |', '|---|---|---|')
          foreach ($f in Get-ChildItem dist -File -Include 'SetupScope-Setup-*.exe', 'SetupScope-*-portable.zip' -Recurse) {
            $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $url = 'https://www.virustotal.com/api/v3/files'
            if ($f.Length -gt 32MB) { $url = (Invoke-RestMethod -Headers $headers https://www.virustotal.com/api/v3/files/upload_url).data }
            $id = (Invoke-RestMethod -Method Post -Headers $headers -Form @{ file = $f } $url).data.id
            $stats = $null
            foreach ($i in 1..40) {
              Start-Sleep -Seconds 30
              $a = Invoke-RestMethod -Headers $headers "https://www.virustotal.com/api/v3/analyses/$id"
              if ($a.data.attributes.status -eq 'completed') { $stats = $a.data.attributes.stats; break }
            }
            $report = "https://www.virustotal.com/gui/file/$sha"
            if (-not $stats) { $lines += "| $($f.Name) | not finished | [report]($report) |"; continue }
            $bad = [int]$stats.malicious + [int]$stats.suspicious
            $total = $bad + [int]$stats.undetected + [int]$stats.harmless
            $lines += "| $($f.Name) | $bad / $total | [report]($report) |"
            if ($bad -gt 0) { Write-Output "::warning title=VirusTotal::$($f.Name): $bad of $total engines flag it. Check $report and report false positives to those vendors." }
          }
          $lines | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $lines | Add-Content dist/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SetupScope ${{ steps.ver.outputs.version }}
          make_latest: true
          body_path: dist/NOTES.md
          files: |
            dist/SetupScope-Setup-*.exe
            dist/SetupScope-*-portable.zip
            dist/SHA256SUMS.txt
