name: Portable Builder Kit
on:
  push:
    branches: [main]
    paths: ['crates/portable-builder-kit/**', 'src/pafbuild.rs', 'src/pafproject.rs', 'src/pafassets.rs', 'src/pafstage.rs', 'src/png.rs', 'src/gui/pafwizard.rs', 'src/paf_installer.nsi', 'src/patools.rs', 'src/util.rs', 'src/gui/builder.rs', 'examples/pafkit_smoke.rs', '.github/workflows/portable-builder-kit.yml']
  pull_request:
    paths: ['crates/portable-builder-kit/**', 'src/pafbuild.rs', 'src/pafproject.rs', 'src/pafassets.rs', 'src/pafstage.rs', 'src/png.rs', 'src/gui/pafwizard.rs', 'src/paf_installer.nsi', 'src/patools.rs', 'src/util.rs', 'src/gui/builder.rs', 'examples/pafkit_smoke.rs', '.github/workflows/portable-builder-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    name: Rust SDK (${{ matrix.os }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: ['1.85.0', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/portable-builder-kit/Cargo.toml -- --check
      - name: Contracts and examples
        run: cargo test --manifest-path crates/portable-builder-kit/Cargo.toml --all-targets --features test-fixture --locked
      - name: Lint
        run: cargo clippy --manifest-path crates/portable-builder-kit/Cargo.toml --all-targets --features test-fixture --locked -- -D warnings

  package-smoke:
    name: Real launcher and package lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch and verify historical official test tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Explicit CI-only, known-hash baseline. Not a product downloader or latest-version claim.
          $root = Join-Path $env:RUNNER_TEMP 'paf-official-tools'
          New-Item -ItemType Directory $root -Force | Out-Null
          $packages = @(
            @{ Name='Installer'; Version='3.9.18'; Folder='PortableApps.com Installer'; Hash='8dc84002f08ae7bf31dd2f422f6f173b6b8ba2371fd508a9876e13f2eb6ef75a' },
            @{ Name='Launcher'; Version='2.2.9'; Folder='PortableApps.com Launcher'; Hash='7bc93e47b885d5e953fa2082a2e65169ae98128026ac4d747f774a23bd01345b' }
          )
          foreach ($package in $packages) {
            $name = "PortableApps.com$($package.Name)_$($package.Version).paf.exe"
            $file = Join-Path $root $name
            $url = 'https://downloads.sourceforge.net/project/portableapps/' + [uri]::EscapeDataString($package.Folder) + '/' + $name
            & curl.exe --fail --location --retry 2 --max-time 180 --output $file $url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $name" }
            if ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() -ne $package.Hash) { throw "Integrity mismatch: $name" }
            $destination = Join-Path $root $package.Name
            & 7z x $file "-o$destination" -y
            if ($LASTEXITCODE -ne 0) { throw "Extraction failed: $name" }
            Write-Host "Verified historical baseline: $name SHA256 $($package.Hash)"
          }
          "PAF_TEST_GENERATOR=$root/Launcher/PortableApps.comLauncherGenerator.exe" >> $env:GITHUB_ENV
          "PAF_TEST_INSTALLER=$root/Installer/PortableApps.comInstaller.exe" >> $env:GITHUB_ENV
      - name: Build the harmless test payload
        run: cargo build --manifest-path crates/portable-builder-kit/Cargo.toml --features test-fixture --bin pafkit-test-tool --locked
      - name: Compile, install, launch, relocate and upgrade
        run: cargo run --example pafkit_smoke --locked -- crates/portable-builder-kit/target/debug/pafkit-test-tool.exe
      - name: Show compiler diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory compiler-diagnostics -Force | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/paf-official-tools" -Recurse -Filter '*Log*' -File -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Official tool log: $($_.FullName)"
            Get-Content $_.FullName | Select-Object -Last 80
            Copy-Item $_.FullName (Join-Path compiler-diagnostics ($_.Directory.Parent.Name + '-' + $_.Name))
          }
          Get-ChildItem "$env:TEMP/installscope-nsis-*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Compiler log: $($_.FullName)"
            Get-Content $_.FullName | Select-Object -Last 80
            New-Item -ItemType Directory compiler-diagnostics -Force | Out-Null
            Copy-Item $_.FullName compiler-diagnostics/
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portable-compiler-diagnostics
          path: compiler-diagnostics/*
          if-no-files-found: ignore
