name: Portable Builder Kit
on:
  push:
    branches: [main]
    paths: ['crates/portable-builder-kit/**', 'src/pafbuild.rs', 'src/pafproject.rs', 'src/pafassets.rs', 'src/pafstage.rs', 'src/png.rs', 'src/gui/pafwizard.rs', 'src/paf_installer.nsi', 'src/patools.rs', 'src/util.rs', 'src/gui/builder.rs', 'examples/pafkit_smoke.rs', '.github/workflows/portable-builder-kit.yml']
  pull_request:
    paths: ['crates/portable-builder-kit/**', 'src/pafbuild.rs', 'src/pafproject.rs', 'src/pafassets.rs', 'src/pafstage.rs', 'src/png.rs', 'src/gui/pafwizard.rs', 'src/paf_installer.nsi', 'src/patools.rs', 'src/util.rs', 'src/gui/builder.rs', 'examples/pafkit_smoke.rs', '.github/workflows/portable-builder-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    name: Rust SDK (${{ matrix.os }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: ['1.85.0', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/portable-builder-kit/Cargo.toml -- --check
      - name: Contracts and examples
        run: cargo test --manifest-path crates/portable-builder-kit/Cargo.toml --all-targets --features test-fixture --locked
      - name: Lint
        run: cargo clippy --manifest-path crates/portable-builder-kit/Cargo.toml --all-targets --features test-fixture --locked -- -D warnings

  package-smoke:
    name: Real launcher and package lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the harmless test payload
        run: cargo build --manifest-path crates/portable-builder-kit/Cargo.toml --features test-fixture --bin pafkit-test-tool --locked
      - name: Compile, install, launch, relocate and upgrade
        run: cargo run --example pafkit_smoke --locked -- crates/portable-builder-kit/target/debug/pafkit-test-tool.exe
      - name: Show compiler diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:TEMP/installscope-nsis-*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Compiler log: $($_.FullName)"
            Get-Content $_.FullName | Select-Object -Last 80
            New-Item -ItemType Directory compiler-diagnostics -Force | Out-Null
            Copy-Item $_.FullName compiler-diagnostics/
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portable-compiler-diagnostics
          path: compiler-diagnostics/*.log
          if-no-files-found: ignore
