name: Focused soak checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: cargo build --example lockholder --locked
      - name: Repeat bounded safety fixtures
        shell: pwsh
        run: |
          foreach ($iteration in 1..5) {
            cargo test --lib --locked
            if ($LASTEXITCODE -ne 0) {throw "Fixture iteration failed: $iteration"}
          }
