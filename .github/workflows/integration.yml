name: Integration

# Real installers on a clean Windows runner: install under monitoring, remove
# with InstallScope, and verify nothing the installation added is left. Runs
# weekly, on release tags, and on demand (Actions tab > Integration > Run).
on:
  schedule:
    - cron: '41 6 * * 0'
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: Run only installers whose name contains this (empty = all)
        default: ''

jobs:
  # One build shared by every test job (each used to build its own).
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile ci --locked
      - uses: actions/upload-artifact@v4
        with:
          name: installscope-ci
          path: target/ci/installscope.exe
          retention-days: 1

  installer:
    name: ${{ matrix.name }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SELECTED: ${{ inputs.only == '' || inputs.only == null || contains(matrix.name, inputs.only) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Programs the runner image doesn't already have installed.
          - name: Windows Installer (KeePassXC MSI)
            url: https://github.com/keepassxreboot/keepassxc/releases/download/2.7.9/KeePassXC-2.7.9-Win64.msi
            file: kp.msi
            exe: msiexec
            args: /i|{file}|/qn|/norestart
          - name: NSIS (Notepad++)
            url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.7.1/npp.8.7.1.Installer.x64.exe
            file: npp.exe
            exe: '{file}'
            args: /S
          - name: Inno Setup
            url: https://files.jrsoftware.org/is/6/innosetup-6.4.3.exe
            mirror: https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe
            file: is.exe
            exe: '{file}'
            args: /VERYSILENT|/SUPPRESSMSGBOXES|/NORESTART|/SP-
          # Per-user, under AppData; starts the program when it finishes.
          - name: Squirrel (Atom)
            url: https://github.com/atom/atom/releases/download/v1.60.0/AtomSetup-x64.exe
            file: atom.exe
            exe: '{file}'
            args: --silent
            roots: '%LOCALAPPDATA%|%USERPROFILE%\.atom'
          # A WiX Burn bundle (chained MSIs, Package Cache, a bundle entry
          # besides the MSI's), with shell extensions and a tray program.
          - name: WiX Burn bundle (PowerToys)
            url: https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysSetup-0.101.2362.0-x64.exe
            file: powertoys.exe
            exe: '{file}'
            args: /quiet|/norestart
            roots: '%ProgramData%\Package Cache'
          # Proprietary installer types with no stable public download: set
          # the repository variables (Settings > Secrets and variables >
          # Actions > Variables) to a setup file you may use for testing.
          - name: InstallShield
            url: ${{ vars.INSTALLSHIELD_URL }}
            file: is_setup.exe
            exe: '{file}'
            args: ${{ vars.INSTALLSHIELD_ARGS || '/s|/v/qn' }}
            needs_var: INSTALLSHIELD_URL
          - name: Wise
            url: ${{ vars.WISE_URL }}
            file: wise_setup.exe
            exe: '{file}'
            args: ${{ vars.WISE_ARGS || '/s' }}
            needs_var: WISE_URL
    steps:
      - uses: actions/download-artifact@v4
        if: env.SELECTED == 'true'
        with:
          name: installscope-ci
          path: target/release
      - name: Portable InstallScope with a focused monitoring scope
        if: env.SELECTED == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory it, it/InstallScopeData | Out-Null
          Copy-Item target/release/installscope.exe it/InstallScope.exe
          New-Item it/portable -ItemType File | Out-Null
          # Extra folders this installer type writes to (AppData, Package Cache).
          $roots = @('${{ matrix.roots }}'.Split('|') | Where-Object { $_ } | ForEach-Object { @{ path = $_; recursive = $true } })
          @{
            first_run_done = $true
            registry_roots = @('HKLM\SOFTWARE', 'HKLM\SYSTEM\CurrentControlSet\Services', 'HKCU\Software', 'HKCU\Environment',
                               'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment')
            file_roots = $roots + @(
              @{ path = '%ProgramFiles%'; recursive = $true },
              @{ path = '%ProgramFiles(x86)%'; recursive = $true },
              @{ path = '%ProgramData%\Microsoft\Windows\Start Menu'; recursive = $true },
              @{ path = '%APPDATA%\Microsoft\Windows\Start Menu'; recursive = $true },
              @{ path = '%PUBLIC%\Desktop'; recursive = $false },
              @{ path = '%USERPROFILE%\Desktop'; recursive = $false }
            )
          } | ConvertTo-Json -Depth 5 | Set-Content it/InstallScopeData/settings.json
      - name: Download installer
        if: env.SELECTED == 'true'
        id: download
        shell: pwsh
        run: |
          if ('${{ matrix.needs_var }}' -and -not '${{ matrix.url }}') {
            Write-Output "::notice title=${{ matrix.name }} not tested::Set the repository variable ${{ matrix.needs_var }} to a setup file's URL to include this installer type."
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $out = "$env:RUNNER_TEMP\${{ matrix.file }}"
          $urls = @("${{ matrix.url }}") + @("${{ matrix.mirror }}" | Where-Object { $_ })
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $out -MaximumRedirection 10
              $b = [IO.File]::ReadAllBytes($out)[0..1]
              if ($b[0] -eq 0x4D -and $b[1] -eq 0x5A -or "${{ matrix.file }}".EndsWith('.msi')) { "Downloaded $u"; exit 0 }
              "Not a program file: $u"
            } catch { "Download failed: $u ($_)" }
          }
          throw "could not download the installer"
      - name: Install under monitoring
        if: env.SELECTED == 'true' && steps.download.outputs.skip != 'true'
        id: monitor
        shell: pwsh
        run: |
          $file = "$env:RUNNER_TEMP\${{ matrix.file }}"
          $exe = '${{ matrix.exe }}'.Replace('{file}', $file)
          $argv = '${{ matrix.args }}'.Replace('{file}', $file).Split('|')
          # InstallScope.exe is a GUI-subsystem program, so PowerShell would not wait
          # for it; Start-Process -Wait does.
          $all = @('monitor', '--no-prompt', '--json', '--', $exe) + $argv | ForEach-Object { if ($_ -match ' ') { '"' + $_ + '"' } else { $_ } }
          # Wait for InstallScope itself, not for programs the installer leaves
          # running (Start-Process -Wait waits for every descendant).
          $p = Start-Process ./it/InstallScope.exe -ArgumentList $all -PassThru -NoNewWindow -RedirectStandardOutput out.json -RedirectStandardError err.txt
          $null = $p.Handle
          if (-not $p.WaitForExit(20 * 60 * 1000)) {
            $recent = Get-Process | Where-Object { $_.StartTime -gt (Get-Date).AddMinutes(-25) } | Sort-Object StartTime | Select-Object -Last 12 | ForEach-Object { "$($_.ProcessName)($($_.Id))" }
            $tail = ((Get-Content err.txt -ErrorAction SilentlyContinue) | Select-Object -Last 6) -join ' | '
            Write-Output ("::error::monitor still running after 20 minutes. Recent processes: " + ($recent -join ', ') + ". Output: " + $tail)
            Stop-Process -Id $p.Id -Force
            throw "monitor timed out"
          }
          $code = $p.ExitCode
          $json = Get-Content out.json -Raw
          Get-Content err.txt | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content err.txt | Select-Object -Last 20 | ForEach-Object { Write-Output "::error::$_" }
            throw "monitor failed (exit $code)"
          }
          $log = $json | ConvertFrom-Json
          "Recorded $($log.name) $($log.version): $($log.stats | ConvertTo-Json -Compress)"
          if (-not $log.uninstall_key) { throw "the installation registered no uninstall entry" }
          "id=$($log.id)" >> $env:GITHUB_OUTPUT
          "finished=$((Get-Date).ToString('o'))" >> $env:GITHUB_OUTPUT
          $warn = @(Get-Content err.txt | Select-String 'could not be read|Could not read' | Select-Object -First 3)
          $warn | ForEach-Object { Write-Output "::warning title=Snapshot::$($_.Line)" }
          "name=$($log.name)" >> $env:GITHUB_OUTPUT
      - name: Make a silent installer from the log
        if: env.SELECTED == 'true' && steps.download.outputs.skip != 'true'
        shell: pwsh
        run: |
          $p = Start-Process ./it/InstallScope.exe -ArgumentList 'repackage', '${{ steps.monitor.outputs.id }}', "$PWD\silent" -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          (Get-Content out.txt) + (Get-Content err.txt) | ForEach-Object { Write-Host $_ }
          if ($p.ExitCode -ne 0) { Write-Output ("::error::" + (((Get-Content err.txt) | Select-Object -Last 6) -join ' | ')); throw "repackage failed" }
          $setup = Get-ChildItem silent -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "no Setup.exe" }
          Write-Host "Silent setup: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
      - name: Remove with InstallScope
        if: env.SELECTED == 'true' && steps.download.outputs.skip != 'true'
        shell: pwsh
        run: |
          $p = Start-Process ./it/InstallScope.exe -ArgumentList 'revert', '${{ steps.monitor.outputs.id }}', '--close-programs', '--restart-explorer', '--keep-log' -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $out = (Get-Content out.txt) + (Get-Content err.txt)
          $out | Set-Content revert.txt
          $out | ForEach-Object { Write-Host $_ }
          if ($p.ExitCode -ne 0) { $out | Select-String 'FAIL' | Select-Object -First 20 | ForEach-Object { Write-Output "::error::$_" }; throw "revert reported failures" }
      - name: Verify nothing is left
        if: env.SELECTED == 'true' && steps.download.outputs.skip != 'true'
        shell: pwsh
        run: |
          $p = Start-Process ./it/InstallScope.exe -ArgumentList 'check-clean', '${{ steps.monitor.outputs.id }}' -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $out = (Get-Content out.txt) + (Get-Content err.txt)
          $out | ForEach-Object { Write-Host $_ }
          if ($p.ExitCode -ne 0) {
            # GitHub keeps only 10 annotations per step: explanations first.
            $left = @($out | Select-String -Pattern '^- Delete (folder|file) (.+)$' | ForEach-Object { $_.Matches[0].Groups[2].Value })
            $why = @(Get-Content revert.txt | Select-String -Pattern ' — .*(next restart|in use|kept|held by|kept running)' | Select-Object -First 3)
            $why | ForEach-Object { Write-Output "::error title=Removal said::$($_.Line)" }
            $dirs = @($left | Where-Object { Test-Path $_ -PathType Container })
            $running = @(Get-Process | Where-Object { $pp = $_.Path; $pp -and ($dirs | Where-Object { $pp.StartsWith($_, 'OrdinalIgnoreCase') }) })
            $running | Select-Object -First 2 | ForEach-Object { Write-Output "::error title=Still running::$($_.ProcessName) ($($_.Id)) $($_.Path)" }
            $inside = @($dirs | ForEach-Object { Get-ChildItem $_ -Recurse -Force -File -ErrorAction SilentlyContinue } | Select-Object -First 2)
            $inside | ForEach-Object {
              $said = Get-Content revert.txt | Select-String -SimpleMatch $_.FullName | Select-Object -First 1
              $note = if ($said) { "removal said: $($said.Line)" } else { 'not in the install log' }
              Write-Output "::error title=Still inside::$($_.FullName) (created $($_.CreationTime.ToString('o')), monitoring finished ${{ steps.monitor.outputs.finished }}); $note"
            }
            if (-not $inside) { Write-Output "::error title=Still inside::nothing: the leftover folders are empty ($($dirs.Count) exist)" }
            $out | Where-Object { $_ -match '^- ' } | Select-Object -First 2 | ForEach-Object { Write-Output "::error::$_" }
            throw "leftovers remain"
          }
          $still = ./it/InstallScope.exe programs | Out-String -Stream | Select-String -SimpleMatch "${{ steps.monitor.outputs.name }}"
          if ($still) { throw "the program is still listed: $still" }

  portable:
    name: PortableApps Forge (${{ matrix.name }})
    if: ${{ !inputs.only }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Programs the runner image doesn't already have installed.
          - name: MSI
            url: https://github.com/keepassxreboot/keepassxc/releases/download/2.7.9/KeePassXC-2.7.9-Win64.msi
            file: kp.msi
            app: KeePassXC
            exe: KeePassXC.exe
          - name: NSIS
            url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.7.1/npp.8.7.1.Installer.x64.exe
            file: npp.exe
            app: Notepad++
            exe: notepad++.exe
          - name: Inno Setup
            url: https://github.com/greenshot/greenshot/releases/download/Greenshot-RELEASE-1.2.10.6/Greenshot-INSTALLER-1.2.10.6-RELEASE.exe
            file: greenshot.exe
            app: Greenshot
            exe: Greenshot.exe
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installscope-ci
          path: target/release
      - name: Download installer
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\${{ matrix.file }}"
          $urls = @("${{ matrix.url }}") + @("${{ matrix.mirror }}" | Where-Object { $_ })
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile $out -MaximumRedirection 10; "Downloaded $u"; exit 0 } catch { "Download failed: $u ($_)" }
          }
          throw "could not download the installer"
      - name: Build a PortableApps.com package (installed on the runner)
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          '' | Set-Content empty.txt
          $all = @('portable-build', "$env:RUNNER_TEMP\${{ matrix.file }}", '--name', '"${{ matrix.app }}"', '--silent', '--here', '--no-prompt', '--out', "$PWD\pkg")
          # Wait for InstallScope itself, not for programs the installer leaves
          # running (Start-Process -Wait waits for every descendant).
          $p = Start-Process target/release/installscope.exe -ArgumentList $all -PassThru -NoNewWindow -RedirectStandardInput empty.txt -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $null = $p.Handle
          if (-not $p.WaitForExit(25 * 60 * 1000)) {
            $recent = Get-Process | Where-Object { $_.StartTime -gt (Get-Date).AddMinutes(-30) } | Sort-Object StartTime | Select-Object -Last 12 | ForEach-Object { "$($_.ProcessName)($($_.Id))" }
            $tail = ((Get-Content err.txt -ErrorAction SilentlyContinue) | Select-Object -Last 8) -join ' | '
            Write-Output ("::error::portable-build still running after 25 minutes. Recent processes: " + ($recent -join ', ') + ". Output: " + $tail)
            Stop-Process -Id $p.Id -Force
            throw "portable-build timed out"
          }
          (Get-Content out.txt) + (Get-Content err.txt) | ForEach-Object { Write-Host $_ }
          if ($p.ExitCode -ne 0) {
            $tail = ((Get-Content err.txt) | Select-Object -Last 8) -join ' | '
            Write-Output ("::error::exit code 0x{0:X8}: {1}" -f $p.ExitCode, $tail)
            throw "portable-build failed"
          }
      - name: Check the package
        shell: pwsh
        run: |
          $pkg = Get-ChildItem pkg -Directory | Select-Object -First 1
          if (-not $pkg) { throw "no package folder" }
          $root = $pkg.FullName
          Write-Host "Package: $root"
          Get-ChildItem $root -Recurse -Depth 2 | Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.FullName.Substring($root.Length))" }
          $info = Get-Content "$root\App\AppInfo\appinfo.ini" -Raw
          Write-Host $info
          foreach ($want in 'Type=PortableApps.comFormat', "AppID=$($pkg.Name)", 'PackageVersion=', "Start=$($pkg.Name).exe") {
            if (-not $info.Contains($want)) { throw "appinfo.ini lacks $want" }
          }
          $ini = Get-Content "$root\App\AppInfo\Launcher\$($pkg.Name).ini" -Raw
          Write-Host $ini
          if (-not $ini.Contains('${{ matrix.exe }}')) { throw "the Launcher settings don't start ${{ matrix.exe }}" }
          $exe = Get-ChildItem "$root\App" -Recurse -Filter '${{ matrix.exe }}' | Select-Object -First 1
          if (-not $exe) { throw "${{ matrix.exe }} was not copied into App" }
          if (-not (Test-Path "$root\App\AppInfo\appicon.ico")) { throw "no appicon.ico" }
          if (-not (Test-Path "$root\help.html")) { throw "no help.html" }
      - name: Check the launcher and installer, and install it like the Platform does
        shell: pwsh
        run: |
          $pkg = Get-ChildItem pkg -Directory | Select-Object -First 1
          $id = $pkg.Name
          if (-not (Test-Path "$($pkg.FullName)\$id.exe")) { throw "no launcher $id.exe" }
          $paf = Get-ChildItem pkg -Filter "$id*.paf.exe" | Select-Object -First 1
          if (-not $paf) { throw "no .paf.exe installer" }
          Write-Host "Installer: $($paf.Name) ($([math]::Round($paf.Length / 1MB, 1)) MB)"
          New-Item -ItemType Directory pa | Out-Null
          $p = Start-Process $paf.FullName -ArgumentList '/S', "/DESTINATION=$PWD\pa\" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          foreach ($want in "$id.exe", 'App\AppInfo\appinfo.ini', "App\AppInfo\Launcher\$id.ini", 'Data') {
            if (-not (Test-Path "pa\$id\$want")) { throw "the installed copy lacks $want" }
          }
          Write-Host "Installed to pa\$id"
