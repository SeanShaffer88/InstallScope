name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The slow full-system performance check runs weekly and on demand,
  # not on every push, so ordinary CI finishes in a few minutes.
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build the locked-file test helper
        run: cargo build --example lockholder --locked
      - name: Unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --lib --locked 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface the failure as annotations so it is visible without the log.
            # A panic's message is on the line after "panicked at".
            Get-Content test.log | Select-String -Pattern '^error|^warning: unused|panicked|FAILED|^test result|left:|right:|^\s+-->' -Context 0,1 |
              Select-Object -Last 45 | ForEach-Object {
                Write-Output "::error::$($_.Line)"
                if ($_.Line -match 'panicked') { $_.Context.PostContext | ForEach-Object { Write-Output "::error::  $_" } }
              }
            exit $code
          }
      - name: Clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy --all-targets --locked 2>&1 | Tee-Object -FilePath clippy.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content clippy.log | Select-String -Pattern '^error' -Context 0,12 | Select-Object -First 8 | ForEach-Object {
              Write-Output "::error::$($_.Line)"
              $_.Context.PostContext | ForEach-Object { Write-Output "::error::  $_" }
            }
            exit $code
          }
      - name: Release build
        run: cargo build --release --locked
      - name: Smoke test the CLI
        shell: pwsh
        run: |
          ./target/release/setupsweep.exe --version
          ./target/release/setupsweep.exe programs | Select-Object -First 5
      - uses: actions/upload-artifact@v4
        with:
          name: SetupSweep-dev
          path: target/release/setupsweep.exe

  arm64:
    name: Build (Windows Arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

  perf:
    name: Performance budget (Windows)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --locked
      - name: Startup and idle budget
        shell: pwsh
        run: |
          # Cold start until the window exists, then 20 s untouched: CPU and memory.
          # Warm-up: the first launch measures program sizes and checks
          # signatures in the background, then caches them for later launches.
          $w = Start-Process ./target/release/setupsweep.exe -PassThru
          Start-Sleep -Seconds 150
          Stop-Process $w -Force
          $runs = @()
          foreach ($n in 1..3) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $env:SETUPSWEEP_REPAINT_LOG = "$PWD\repaint-$n.log"
            $p = Start-Process ./target/release/setupsweep.exe -PassThru
            while ($p.MainWindowHandle -eq 0 -and $sw.Elapsed.TotalSeconds -lt 30) { Start-Sleep -Milliseconds 25; $p.Refresh() }
            $startMs = [int]$sw.Elapsed.TotalMilliseconds
            Start-Sleep -Seconds 30; $p.Refresh()
            $cpu0 = $p.TotalProcessorTime.TotalMilliseconds
            Start-Sleep -Seconds 20; $p.Refresh()
            $idle = [Math]::Round(($p.TotalProcessorTime.TotalMilliseconds - $cpu0) / 200 / [Environment]::ProcessorCount, 2)
            $ram = [Math]::Round($p.WorkingSet64 / 1MB)
            $priv = [Math]::Round($p.PrivateMemorySize64 / 1MB)
            Stop-Process $p -Force
            $runs += [pscustomobject]@{ start = $startMs; idle = $idle; ram = $ram; priv = $priv }
          }
          $runs | ForEach-Object { Write-Host "run: window $($_.start) ms, idle $($_.idle) %, $($_.ram) MB" }
          # Why frames were drawn in the last run's idle period (most common causes).
          $lines = Get-Content repaint-3.log
          Write-Host "frames drawn: $($lines.Count)"
          $lines | Select-Object -Last 300 | ForEach-Object { ($_ -split ' ', 2)[1] } | Group-Object | Sort-Object Count -Descending | Select-Object -First 6 |
            ForEach-Object { Write-Host "::notice title=Repaint cause::$($_.Count)x $($_.Name)" }
          $start = ($runs.start | Sort-Object)[1]
          $idle = ($runs.idle | Sort-Object)[1]
          $ram = ($runs.ram | Measure-Object -Maximum).Maximum
          $priv = ($runs.priv | Measure-Object -Maximum).Maximum
          Write-Host "::notice title=Startup and idle::window after $start ms, idle CPU $idle %, working set $ram MB, private $priv MB"
          @"
          ### Startup and idle
          | Measure | Value | Budget |
          |---|---|---|
          | Time until the window appears (median of 3) | $start ms | 3000 ms |
          | CPU while idle (median of 3) | $idle % | 1 % |
          | Working set | $ram MB | 400 MB |
          | Private memory | $priv MB | |
          "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($start -gt 3000 -or $idle -gt 1 -or $ram -gt 400) { throw "Startup or idle budget exceeded" }
      - name: Performance budget
        shell: pwsh
        run: |
          # Full system snapshot on the (large) CI image: time and peak memory.
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process ./target/release/setupsweep.exe -ArgumentList 'snapshot','perf.snap' -PassThru -NoNewWindow
          $peak = 0
          while (-not $p.HasExited) { $p.Refresh(); $peak = [Math]::Max($peak, $p.PeakWorkingSet64); Start-Sleep -Milliseconds 200 }
          $sw.Stop()
          $secs = [Math]::Round($sw.Elapsed.TotalSeconds, 1)
          $mb = [Math]::Round($peak / 1MB)
          $snapMb = [Math]::Round((Get-Item perf.snap).Length / 1MB, 1)
          $exeMb = [Math]::Round((Get-Item ./target/release/setupsweep.exe).Length / 1MB, 1)
          $sw2 = [Diagnostics.Stopwatch]::StartNew()
          ./target/release/setupsweep.exe programs --trust --json | Out-Null
          $trustSecs = [Math]::Round($sw2.Elapsed.TotalSeconds, 1)
          @"
          ### Performance
          | Measure | Value | Budget |
          |---|---|---|
          | Snapshot time | $secs s | 1800 s |
          | Snapshot peak memory | $mb MB | 1500 MB |
          | Snapshot file | $snapMb MB | |
          | Program list with signatures | $trustSecs s | 300 s |
          | SetupSweep.exe size | $exeMb MB | 40 MB |
          "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "snapshot ${secs}s, peak ${mb}MB, signatures ${trustSecs}s, exe ${exeMb}MB"
          Write-Host "::notice title=Performance::snapshot $secs s, peak $mb MB, file $snapMb MB, signatures $trustSecs s, exe $exeMb MB"
          # Time limits are loose because hosted runner speed varies several-fold
          # for the same code (the same commit measured 5 and 20 minutes);
          # memory is deterministic and stays strict.
          if ($secs -gt 1800 -or $mb -gt 1500 -or $trustSecs -gt 300 -or $exeMb -gt 40) { throw "Performance budget exceeded" }

  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --locked
