name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test & build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the locked-file test helper
        run: cargo build --example lockholder --locked
      - name: Unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --lib --locked 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface the failure as annotations so it is visible without the log.
            # A panic's message is on the line after "panicked at".
            Get-Content test.log | Select-String -Pattern '^error|^warning: unused|panicked|FAILED|^test result|left:|right:|^\s+-->' -Context 0,1 |
              Select-Object -Last 45 | ForEach-Object {
                Write-Output "::error::$($_.Line)"
                if ($_.Line -match 'panicked') { $_.Context.PostContext | ForEach-Object { Write-Output "::error::  $_" } }
              }
            exit $code
          }
      - name: Focused UI tests
        run: cargo test --bin setupscope --locked
      - name: Clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy --all-targets --locked 2>&1 | Tee-Object -FilePath clippy.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content clippy.log | Select-String -Pattern '^error' -Context 0,12 | Select-Object -First 8 | ForEach-Object {
              Write-Output "::error::$($_.Line)"
              $_.Context.PostContext | ForEach-Object { Write-Output "::error::  $_" }
            }
            exit $code
          }
      - name: Release build
        run: cargo build --release --locked
      - name: Safe version/help smoke
        shell: pwsh
        run: |
          foreach ($option in '--version','--help') {
            $app = Start-Process ./target/release/setupscope.exe -ArgumentList $option -Wait -PassThru -WindowStyle Hidden
            if ($app.ExitCode -ne 0) { throw "Smoke failed: $option" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SetupScope-dev
          path: target/release/setupscope.exe

  arm64:
    name: Build (Windows Arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --lib --locked
